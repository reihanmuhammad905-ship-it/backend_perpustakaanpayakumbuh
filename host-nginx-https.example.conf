# Untuk Nginx DI HOST SERVER Docker; DNS dan sertifikat harus aktif dahulu.
# Jika reverse proxy berada pada host berbeda, minta admin server mengubah upstream.
server {
    listen 80;
    server_name admin-perpus.payakumbuhkota.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin-perpus.payakumbuhkota.go.id;

    ssl_certificate /etc/letsencrypt/live/admin-perpus.payakumbuhkota.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-perpus.payakumbuhkota.go.id/privkey.pem;

    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
